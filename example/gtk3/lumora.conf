name = "lumora-gtk3"
version = "0.1.0"
output_dir = "build"

[extensions]
dir = "../../build/extensions/example"

[source.main]
files = ["main.lm"]

[opt.release]
input  = "build/main.ll"
output = "build/main.opt.ll"
level = "O2"
passes = ["mem2reg", "instcombine", "simplifycfg", "gvn"]

[link.binary]
linker  = "clang"
inputs  = ["build/main.opt.ll"]
output  = "build/lumora-gtk3"
libs    = ["c", "m", "gtk-3", "gobject-2.0", "glib-2.0"]
